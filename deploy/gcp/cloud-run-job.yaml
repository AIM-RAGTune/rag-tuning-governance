apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ragtune-governance-job
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: ghcr.io/aim-ragtune/rag-tuning-governance@sha256:PENDING_FIRST_WORKFLOW_RUN
              args:
                - run-governance-job
                - --config
                - /inputs/public_mini_governance_job.yaml
                - --output-root
                - /outputs
                - --decision-out
                - /outputs/promotion_decision.json
              env:
                - name: RAGTUNE_STORAGE_MODE
                  value: local
                - name: RAGTUNE_INPUT_DIR
                  value: /inputs
                - name: RAGTUNE_OUTPUT_DIR
                  value: /outputs
          maxRetries: 0
