AWSTemplateFormatVersion: "2010-09-09"
Description: Example RAGTune ECS Fargate task definition
Parameters:
  ContainerImage:
    Type: String
    Default: RAGTUNE_IMAGE_REFERENCE_PLACEHOLDER
Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ragtune-governance-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "1024"
      Memory: "2048"
      ContainerDefinitions:
        - Name: ragtune
          Image: !Ref ContainerImage
          Command:
            - run-governance-job
            - --config
            - /inputs/public_mini_governance_job.yaml
            - --output-root
            - /outputs
            - --decision-out
            - /outputs/promotion_decision.json
          Environment:
            - Name: RAGTUNE_STORAGE_MODE
              Value: local
            - Name: RAGTUNE_INPUT_DIR
              Value: /inputs
            - Name: RAGTUNE_OUTPUT_DIR
              Value: /outputs
          ReadonlyRootFilesystem: true
