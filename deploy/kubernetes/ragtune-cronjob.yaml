apiVersion: batch/v1
kind: CronJob
metadata:
  name: ragtune-governance-cronjob
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ragtune
              image: ghcr.io/example/ragtune-governance:latest
              args:
                - run-governance-job
                - --config
                - /configs/job.yaml
                - --output-root
                - /outputs
                - --decision-out
                - /outputs/promotion_decision.json
              volumeMounts:
                - name: ragtune-config
                  mountPath: /configs
                - name: ragtune-outputs
                  mountPath: /outputs
          volumes:
            - name: ragtune-config
              configMap:
                name: ragtune-job-config
            - name: ragtune-outputs
              persistentVolumeClaim:
                claimName: ragtune-outputs
