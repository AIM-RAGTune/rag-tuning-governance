apiVersion: batch/v1
kind: Job
metadata:
  name: ragtune-governance-job
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ragtune
          image: RAGTUNE_IMAGE_REFERENCE_PLACEHOLDER
          imagePullPolicy: Always
          args:
            - run-governance-job
            - --config
            - /inputs/public_mini_governance_job.yaml
            - --output-root
            - /outputs
            - --decision-out
            - /outputs/promotion_decision.json
          env:
            - name: RAGTUNE_STORAGE_MODE
              value: local
            - name: RAGTUNE_INPUT_DIR
              value: /inputs
            - name: RAGTUNE_OUTPUT_DIR
              value: /outputs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ragtune-config
              mountPath: /inputs
              readOnly: true
            - name: ragtune-outputs
              mountPath: /outputs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ragtune-config
          configMap:
            name: ragtune-job-config
        - name: ragtune-outputs
          persistentVolumeClaim:
            claimName: ragtune-outputs
        - name: tmp
          emptyDir: {}
