name: Validate RAGTune Docker Image
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ragtune-governance:ci .
      - name: Validate publication bundle
        run: docker run --rm ragtune-governance:ci validate-bundle
