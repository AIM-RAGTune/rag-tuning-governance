experiment_name: full_spectra_matrix
dataset_version_policy:
  mode: catalog_latest
  allow_latest: true
split:
  mode: catalog_resolve
  seed: 42
  split_id_template: "default_target_{target}_seed_{seed}"
  create_missing: false
datasets: [energy, oilgas, maintenance, telecom]
targets: [target, target_real, in_pocket]
seed: 42
models:
  - logistic_regression
  - random_forest
  - hist_gradient_boosting
  - xgboost_optional
  - lightgbm_optional
  - mlp
  - fourier_mlp
  - gate_inspired_vqc_surrogate
  - gate_inspired_fourier_series
  - sq-removedsim_full
  - sq-removedsim_no_feedback
  - sq-removedsim_no_nonlinear
  - sq-removedsim_no_memory
  - sq-removedsim_no_overlap_zones
  - sq-removedsim_static_emitters
  - sq-removedsim_no_phase
  - sq-removedsim_linear_field_only
feature_policy:
  exclude_roles: [target, target_real, pocket_flag]
  exclude_columns: []
  exclude_patterns: []
  leakage_warning_policy: warn_and_downgrade_certificate
  acknowledged_leakage_warnings: []
run_policy:
  resume: true
  skip_completed: true
  fail_fast: false
  continue_on_model_failure: true
training:
  max_epochs: 50
  batch_size: 1024
  learning_rate: 0.001
  bootstrap_samples: 1000
resources:
  device: cuda:0
  num_workers: 8
reporting:
  generate_run_explanations: true
  generate_comparison_reports: true
  generate_certificates: true
  bootstrap_samples: 1000
