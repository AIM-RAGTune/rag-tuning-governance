experiment_name: smoke_energy_sq-removedsim
dataset_version_policy:
  mode: catalog_latest
  allow_latest: true
split:
  mode: catalog_resolve
  seed: 42
  split_id_template: "default_target_{target}_seed_{seed}"
  create_missing: false
dataset: energy
target: target
seed: 42
models:
  - logistic_regression
  - hist_gradient_boosting
  - fourier_mlp
  - sq-removedsim_full
  - sq-removedsim_no_feedback
feature_policy:
  exclude_roles: [target, target_real, pocket_flag]
  exclude_columns: []
  exclude_patterns: []
  leakage_warning_policy: warn_and_downgrade_certificate
  acknowledged_leakage_warnings: []
run_policy:
  resume: true
  skip_completed: true
  fail_fast: false
  continue_on_model_failure: true
training:
  max_epochs: 5
  batch_size: 512
  learning_rate: 0.001
  bootstrap_samples: 100
resources:
  device: cpu
  num_workers: 4
reporting:
  generate_run_explanations: true
  generate_comparison_reports: true
  generate_certificates: true
  bootstrap_samples: 100
