experiment_name: snapshot_second_pass_telecom_oilgas
dataset_version_policy:
  mode: catalog_latest
  allow_latest: true
split:
  mode: catalog_resolve
  seed: 42
  split_id_template: "default_target_{target}_seed_{seed}"
  create_missing: false
datasets: [telecom, oilgas]
targets:
  - target_all_rows
  - target_pocket_only
  - delta_label_all_rows
  - delta_label_pocket_only
  - target_real_all_rows
seed: 42
seeds: [11, 17, 23, 42, 101]
models:
  - logistic_regression
  - random_forest
  - hist_gradient_boosting
  - fourier_mlp
  - squaresim_full
  - squaresim_no_phase
  - squaresim_no_memory
  - squaresim_static_emitters
  - squaresim_snapshot_rollout
  - squaresim_snapshot_no_fork
  - squaresim_snapshot_linear_rollout
  - squaresim_snapshot_no_merge
  - squaresim_snapshot_no_feedback
  - squaresim_snapshot_no_nonlinear
feature_policy:
  exclude_roles: [target, target_real, pocket_flag]
  exclude_columns: []
  exclude_patterns: []
  leakage_warning_policy: warn_and_downgrade_certificate
  acknowledged_leakage_warnings:
    - call_failure
training:
  max_epochs: 20
  batch_size: 512
  learning_rate: 0.001
  bootstrap_samples: 1000
resources:
  device: cuda:0
  num_workers: 8
reporting:
  generate_run_explanations: true
  generate_comparison_reports: true
  generate_certificates: true
  bootstrap_samples: 1000
