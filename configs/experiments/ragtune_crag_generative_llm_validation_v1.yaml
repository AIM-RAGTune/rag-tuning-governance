suite: ragtune_crag_generative_llm_validation_v1
suite_version: 1
seed: 20260810

dataset:
  source: crag
  require_noncommercial_research_approval: true
  export_raw_question_text: false
  export_raw_evidence_text: false
  export_raw_api_response: false

sample:
  development_rows: 20
  validation_rows: 40
  confirmatory_rows: 40
  max_total_rows: 100

generator:
  provider_env: RAGTUNE_GENERATOR_PROVIDER
  model_env: RAGTUNE_GENERATOR_MODEL
  prompt_text_exported: false
  raw_generated_answer_exported: false

quality:
  metric_config: configs/experiments/ragtune_generated_answer_quality_v1.yaml
  generated_quality_noninferiority_margin: 0.01
  block_constant_zero_signal: true

selector:
  primary_endpoint_env: RAGTUNE_CRAG_GEN_PRIMARY_ENDPOINT
  latency_guardrail_env: RAGTUNE_CRAG_GEN_LATENCY_GUARDRAIL
  quality_risk_guardrail_policy: quality_guarded_latency_adaptive_expansion
  quality_risk_guardrail_rule: start with two evidence items and expand to five when local CRAG answer/alternate-answer containment is absent
  export_raw_guardrail_text: false

output:
  sanitize_raw_text: true
  append_only: true
