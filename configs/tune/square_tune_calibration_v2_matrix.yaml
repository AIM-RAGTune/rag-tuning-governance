experiment_name: square_tune_calibration_v2_matrix
dataset_root: ${SQUARESIM_DATA_ROOT}/datasets/synthetic/square_tune_calibration_v2
protocol_path: protocols/square_tune/synthetic_calibration_protocol_v2.yaml
datasets:
  - synthetic_llm_random_label
  - synthetic_llm_linear_control
  - synthetic_llm_merge_required
  - synthetic_llm_repeated_regression_memory
  - synthetic_llm_regression_veto
  - synthetic_llm_cost_tradeoff
  - synthetic_llm_data_poison_regression
  - synthetic_llm_prompt_regression
  - synthetic_llm_nonmonotonic_data_mix
  - synthetic_llm_failure_cluster_routing
  - synthetic_llm_adapter_tradeoff
  - synthetic_llm_rag_policy_conflict
seeds: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1001]
optimizers:
  - linear_utility_optimizer
  - ridge_utility_optimizer
  - coordinate_descent
  - random_search
  - greedy_eval_improvement
  - greedy_regression_aware
  - evolutionary_search
  - optuna_tpe_optional
  - square_tune_full
  - square_tune_no_snapshot
  - square_tune_no_fork
  - square_tune_linear_rollout
  - square_tune_no_merge
  - square_tune_no_memory
  - square_tune_no_feedback
  - square_tune_no_regression_sensor
  - square_tune_no_cost_sensor
  - square_tune_global_only
bootstrap_samples: 1000
square_tune:
  max_rounds: 8
  num_branches: 6
  rollout_steps: 3
  simulated_gpu_hour_budget: 8.0
  eval_budget: 144
  max_response_surface_evaluations: 144
  max_candidate_actions: 144
  budget_ledger_enabled: true
  region_selector: regression_adjusted_failure_cluster
  branch_policy: mixed_structured_and_exploratory
  rollout_mode: nonlinear_response_surface
  merge_strategy: constraint_gated_pareto_merge
  memory_enabled: true
  feedback_enabled: true
  regression_sensor_enabled: true
  cost_sensor_enabled: true
  objective_weights:
    domain_accuracy: 0.30
    retrieval_faithfulness: 0.20
    instruction_following: 0.15
    safety: 0.15
    style_match: 0.05
    regression_score: 0.10
    cost: -0.05
