external_datasets:
  - key: example_qa_eval
    source_type: huggingface
    dataset_id: "<user-provided-dataset-id>"
    split: validation
    license_required: true
    text_fields: ["question", "answer"]
    target_fields: []
    purpose: rag_or_qa_eval
  - key: local_enterprise_policy_synthetic
    source_type: local_jsonl
    path: "/path/to/file.jsonl"
    license_required: true
    purpose: domain_policy_eval
