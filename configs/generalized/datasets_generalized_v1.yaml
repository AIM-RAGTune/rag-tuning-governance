datasets:
  rag:
    enabled: true
    source_type: external_proxy_or_synthetic
    preferred_sources: [ragtruth, hagrid, expertqa, ragbench]
    license_required: true
    publication_safe: true
    rows: 2000
  patient_flow:
    enabled: true
    source_type: synthetic_proxy_or_manual_mimic
    mimic_requires_credentialing: true
    allow_synthetic_proxy: true
    publication_safe: true
    rows: 2000
  elastic_compute:
    enabled: true
    source_type: synthetic_trace_or_manual_cluster_trace
    preferred_sources: [google_cluster_trace, alibaba_cluster_trace]
    publication_safe: true
    rows: 2000
  ml_to_llm:
    enabled: true
    source_type: synthetic_hybrid_proxy
    publication_safe: true
    rows: 2000
