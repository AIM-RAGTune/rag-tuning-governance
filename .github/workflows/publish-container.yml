name: Publish Container

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/aim-ragtune/rag-tuning-governance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build input hash
        id: input_hash
        run: echo "value=$(python3 scripts/compute_container_build_input_hash.py)" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AIM-RAGTune/rag-tuning-governance
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign digest with keyless identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Record digest artifact
        run: |
          python3 scripts/record_image_digest.py \
            --digest "${{ steps.build.outputs.digest }}" \
            --candidate-tag "${{ github.sha }}" \
            --source-commit "${{ github.sha }}" \
            --build-input-sha256 "${{ steps.input_hash.outputs.value }}" \
            --output IMAGE_DIGEST

      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: ragtune-image-digest
          path: IMAGE_DIGEST

