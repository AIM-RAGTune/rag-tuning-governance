suite: ragtune_crag_mock_api_validation_v1
suite_version: 1
seed: 20260809

gate:
  require_mock_api_server_smoke_result: MOCK_API_SERVER_SMOKE_PASSED
  require_noncommercial_research_restriction: true

validation:
  validation_queries: 80
  confirmatory_queries: 120
  cost_weight: 0.01
  latency_weight: 0.001
  max_mean_budget_units: 2.6
  max_mean_latency_ms: 4000
  bootstrap_samples: 1000
  timeout_seconds: 240

mock_api:
  compat_python: <compat-runtime>/python
  validation_port: 18086
  allow_external_network: false
  sanitize_logs: true

output:
  append_only: true
  validate_schemas: true
  write_markdown_report: true
